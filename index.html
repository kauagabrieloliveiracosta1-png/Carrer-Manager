function autoManagerLineup(){S.managerLineup=(S.managerSquad||[]).slice().sort((a,b)=>b.rating-a.rating).slice(0,11).map(p=>p.id);autoSave();render();toast('Melhores jogadores escalados.')}
function saveManagerLineup(){if((S.managerLineup||[]).length!==11)return toast('Selecione exatamente 11 titulares.');autoSave();toast('Escalação salva.')}
function managerTransfersPage(){const market=S.managerMarket||[];return head('Janela de transferências','Mercado de jogadores','Contrate reforços para o seu clube. Os valores são demonstrativos nesta versão.')+`<div class="grid stats">${stat('Orçamento',fmt(S.managerBudget||0),'Disponível')}${stat('Jogadores no mercado',market.length,'Oportunidades')}${stat('Elenco atual',(S.managerSquad||[]).length,'Jogadores')}${stat('Folha mensal',fmt((S.managerSquad||[]).reduce((a,p)=>a+p.wage,0)),'Custo salarial')}</div>${card('Jogadores disponíveis',`<div class="tablewrap"><table><thead><tr><th>Jogador</th><th>Posição</th><th>Idade</th><th>OVR</th><th>Valor</th><th>Salário</th><th></th></tr></thead><tbody>${market.map(p=>`<tr><td>${p.name}</td><td>${p.pos}</td><td>${p.age}</td><td><strong>${p.rating}</strong></td><td>${fmt(p.value)}</td><td>${fmt(p.wage)}</td><td><button class="primary" onclick="buyManagerPlayer('${p.id}')">Contratar</button></td></tr>`).join('')}</tbody></table></div>`)}`}
function buyManagerPlayer(id){const p=(S.managerMarket||[]).find(x=>x.id===id);if(!p)return;if(p.value>(S.managerBudget||0))return toast('Orçamento insuficiente.');if((S.managerSquad||[]).length>=30)return toast('Elenco cheio. Venda jogadores antes.');S.managerBudget-=p.value;S.managerSquad.push({...p,id:'c'+Math.random().toString(36).slice(2,10),club:S.managerClub});S.managerMarket=S.managerMarket.filter(x=>x.id!==id);log(`${p.name} contratado pelo ${S.managerClub} por ${fmt(p.value)}.`);autoSave();render();toast('Contratação concluída.')}
function sellManagerPlayer(id){const p=(S.managerSquad||[]).find(x=>x.id===id);if(!p)return;if(!confirm('Colocar '+p.name+' à venda por '+fmt(p.value*0.85)+'?'))return;S.managerBudget=(S.managerBudget||0)+p.value*.85;S.managerSquad=S.managerSquad.filter(x=>x.id!==id);S.managerLineup=(S.managerLineup||[]).filter(x=>x!==id);log(`${p.name} vendido por ${fmt(p.value*.85)}.`);autoSave();render()}

function toast(m){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;bottom:20px;right:20px;background:#203b37;border:1px solid #42c58a;padding:12px 16px;border-radius:10px;z-index:10;color:white;box-shadow:0 8px 30px #0008';document.body.appendChild(e)}e.textContent=m;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2300)}
function saveGame(){localStorage.setItem('careerManagerSave',JSON.stringify(S));savedCareer={...S};document.getElementById('saveStatus').textContent='Salvo '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});toast('Carreira salva neste navegador.')}
function autoSave(){localStorage.setItem('careerManagerSave',JSON.stringify(S));savedCareer={...S}}
function log(m){S.log.unshift(m);S.news.unshift(m);S.log=S.log.slice(0,40);S.news=S.news.slice(0,20)}
function fmtDate(){return ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][S.month]+' '+S.year}

function clubCrestUrl(name,league=''){
 const brName=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
 if(['america rn','america-rn','america de natal','america futebol clube (natal)','america futebol clube rn'].includes(brName))return 'https://commons.wikimedia.org/wiki/Special:FilePath/Am%C3%A9rica%20Futebol%20Clube%20(Natal%2C%20Rio%20Grande%20do%20Norte)%20logo.svg';
 if(['abc','abc-rn','abc rn','abc futebol clube','abc futebol clube-rn','abc futebol clube (rn)','abc de natal'].includes(brName))return 'https://www.footylogos.com/downloads/logo/abc-logo-footylogos.svg';
 if(['asa','asa-al','asa de arapiraca','agremiacao sportiva arapiraquense','agremiacao sportiva arapiraquense (asa)'].includes(brName))return 'https://www.footylogos.com/downloads/logo/asa-de-arapiraca-logo-footylogos.svg';
 if(['sao jose-rs','sao jose rs','sao jose (rs)','ec sao jose','esporte clube sao jose','sao jose esporte clube','sao jose porto alegre'].includes(brName))return 'https://commons.wikimedia.org/wiki/Special:FilePath/Esporte%20Clube%20S%C3%A3o%20Jos%C3%A9%20logo.png';
if(name==='Athletic Club-MG'||name==='Athletic Club MG'||name==='Athletic'){return 'https://commons.wikimedia.org/wiki/Special:FilePath/Athletic%20Club%20(Minas%20Gerais).svg';}if(name==='Athletic Club'){if(String(league).includes('Série B')||String(league).includes('Brasileiro'))return 'https://commons.wikimedia.org/wiki/Special:FilePath/Athletic%20Club%20(Minas%20Gerais).svg';if(league==='La Liga'||String(league).toLowerCase().includes('espan'))return 'https://escudosfc.com.br/images/athletic.png';}if(name==='Athletic Club ESP')return 'https://escudosfc.com.br/images/athletic.png';return laLigaCrests[name]||officialCrests[name]||''}
function crest(c,large=false){const name=c.name||'',url=clubCrestUrl(name,c.league||c.country||'');if(url){const cleanClass=name==='Atlético de Madrid'?' crest-atletico':'';return `<div class="crest official${cleanClass}" title="Escudo oficial de ${name}"><img src="${url}" alt="Escudo ${name}" loading="lazy"></div>`}return `<div class="crest" style="background:linear-gradient(145deg,${c.colors?.[0]||'#31557a'},${c.colors?.[1]||'#132238'})" title="Escudo ilustrativo de ${name}">${c.abbr||name.split(' ').map(x=>x[0]).join('').slice(0,4)}</div>`}
function clubBadge(name,league=''){
 const url=clubCrestUrl(name,league);
 const special=name==='Atlético de Madrid'?' crest-atletico-img':name==='Roma'?' crest-roma':name==='Venezia'?' crest-venezia':'';
 const initials=String(name).split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
 if(url)return `<span class="club-badge-wrap"><img class="tablecrest${special}" src="${url}" alt="Escudo ${name}" loading="eager" decoding="async" onerror="this.onerror=null;this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='inline-flex'"><span class="continental-fallback-crest" style="display:none" title="${name} • escudo indisponível">${initials}</span></span>`;
 return `<span class="continental-fallback-crest" title="${name} • escudo ilustrativo">${initials}</span>`;
}
function head(k,t,d,extra=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${t}</h1><div class="muted">${d}</div></div>${extra}</div>`}
function stat(l,v,s='',c=''){return `<div class="card"><div class="statlabel">${l}</div><div class="statvalue ${c}">${v}</div>${s?`<div class="muted small">${s}</div>`:''}</div>`}
function card(t,b){return `<section class="card"><h2>${t}</h2>${b}</section>`}
function row(a,b){return `<div class="item"><span class="muted">${a}</span><strong>${b}</strong></div>`}
function render(){let aside=document.getElementById('nav'),main=document.getElementById('main'),save=document.getElementById('saveButton'),home=document.getElementById('homeButton');if(['mainmenu','setup'].includes(S.page)){aside.style.display='none';document.querySelector('.layout').style.gridTemplateColumns='1fr';save.style.display='none';home.style.display='none';document.getElementById('dateTop').textContent='Simulador de gestão de clubes';main.innerHTML=S.page==='mainmenu'?mainMenu():setupPage();return}aside.style.display='';document.querySelector('.layout').style.gridTemplateColumns='';save.style.display='';home.style.display='';aside.innerHTML=navItems.map(n=>(n[3]?`<div class="navgroup">${n[3]}</div>`:'')+`<button class="nav ${S.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('');document.getElementById('dateTop').textContent=`${S.managerClub||'Sem clube'} • Semana ${S.week}/38 • ${S.seasonYear}`;document.getElementById('saveStatus').textContent='Treinador: '+(S.managerName||'—');let pages={dashboard:managerDashboard,managerSquad:managerSquadPage,managerTactics:managerTacticsPage,managerTransfers:managerTransfersPage,leagueTable,continental:continentalPage,champions:championsPage,clubs:clubsPage,clubDetail:clubDetailPage,finance:managerFinance,calendar:managerCalendar,news:managerNews};main.innerHTML=(pages[S.page]||managerDashboard)()}function mainMenu(){let has=!!savedCareer;return `<div class="mainmenu"><div class="menuwrap"><div class="menusub">Football club management simulator</div><div class="menulogo">CAREER <span>MANAGER</span></div><div class="muted">Assuma um clube. Monte seu elenco. Dispute títulos. Construa uma história.</div><div class="menucard"><div class="eyebrow">Menu principal</div><h2 style="font-size:23px;margin:5px 0 3px">Sua carreira como treinador começa aqui</h2><div class="muted small">Gerencie o clube dentro e fora de campo, do mercado à escalação.</div><button class="primary" onclick="startNew()">Nova carreira de treinador</button><button ${has?'':'disabled'} onclick="continueGame()">Continuar ${has?'— '+(savedCareer.managerClub||'Minha carreira'):''}</button><button onclick="about()">Sobre o jogo</button>${has?'<button class="danger" onclick="deleteSave()">Excluir save</button>':''}</div><div class="menufoot">CAREER MANAGER • PROTÓTIPO JOGÁVEL</div></div></div>`}function startNew(){resetLeagueTeams();S=initial();S.rosterVersion=2;S.page='setup';savedCareer=null;render()}
function setupPage(){const teams=Object.entries(leagueTeams).flatMap(([l,ts])=>ts.map(t=>({name:t,league:l}))).sort((a,b)=>a.name.localeCompare(b.name));return `<div class="mainmenu"><div class="menuwrap"><div class="menusub">Nova carreira • escolha seu desafio</div><div class="menulogo" style="font-size:clamp(32px,6vw,52px)">SEJA O <span>TÉCNICO</span></div><div class="muted">Escolha seu nome, o clube que vai comandar e as ligas que deseja acompanhar.</div><div class="menucard" style="max-width:760px"><div class="formgrid"><div><label>Nome do treinador</label><input id="setupManager" placeholder="Ex.: Rafael Costa" maxlength="40"></div><div><label>Clube para comandar</label><select id="setupClub">${teams.map(x=>`<option value="${x.name}" data-league="${x.league}">${x.name} — ${x.league}</option>`).join('')}</select></div></div><div class="divider"></div><h2>Ligas para acompanhar</h2><div class="muted small" style="margin-bottom:12px">Selecione os países. Todas as divisões disponíveis serão adicionadas automaticamente.</div><div class="grid three">${Object.entries(leagueCountries).map(([country,ls])=>`<label style="display:flex;gap:8px;align-items:center;background:#0c1728;border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--text)"><input type="checkbox" name="setupCountry" value="${country}" ${country==='Brasil'?'checked':''} style="width:auto"><span><strong>${country}</strong><div class="muted small">${ls.length} ${ls.length===1?'liga':'ligas'}</div></span></label>`).join('')}</div><div class="notice" style="margin-top:12px">Você poderá acompanhar várias ligas ao mesmo tempo. Todas as partidas das competições selecionadas serão simuladas quando avançar a rodada.</div><div class="actions" style="margin-top:18px"><button class="primary" onclick="finishSetup()">Assumir o comando</button><button onclick="S.page='mainmenu';render()">Voltar ao menu principal</button></div></div></div></div>`}function finishSetup(){resetLeagueTeams();S.leagueTeams=null;S.rosterVersion=5;S.seasonHistory=[];S.seasonFinalizedYear=null;S.continental=null;const manager=document.getElementById('setupManager').value.trim(),club=document.getElementById('setupClub').value,selectedCountries=[...document.querySelectorAll('input[name=setupCountry]:checked')].map(x=>x.value);let selected=[...new Set(selectedCountries.flatMap(country=>leagueCountries[country]||[]))];if(selected.some(l=>l==='Campeonato Brasileiro Série A'||l==='Campeonato Brasileiro Série B'))selected=[...new Set([...selected,'Campeonato Brasileiro Série A','Campeonato Brasileiro Série B'])];if(selected.includes('MLS – Leste e Oeste'))selected=[...new Set([...selected.filter(l=>l!=='MLS – Leste e Oeste'),'MLS – Conferência Leste','MLS – Conferência Oeste'])];if(!manager)return toast('Informe o nome do treinador.');if(!selected.length)return toast('Escolha pelo menos um país para acompanhar.');const clubLeague=Object.keys(leagueTeams).find(l=>(leagueTeams[l]||[]).includes(club));if(!clubLeague)return toast('Não foi possível identificar a liga do clube.');if(!selected.includes(clubLeague))selected.push(clubLeague);S.managerName=manager;S.managerClub=club;S.managerLeague=clubLeague;S.leagues=selected;S.setupComplete=true;S.seasonYear=2026;S.year=2026;S.week=0;S.window2Active=false;S.repEventKeys=[];S.leagueTables={};ensureLeagueTables();S.matchHistory=[];S.managerBudget=club==='Flamengo'||club==='Palmeiras'?45:club==='Corinthians'||club==='São Paulo'?30:18;S.managerWageBudget=S.managerBudget*.12;S.managerFormation='4-3-3';S.managerStyle='Equilibrado';S.managerSquad=generateManagerSquad(club);S.managerMarket=generateManagerMarket();S.managerLineup=S.managerSquad.slice(0,11).map(p=>p.id);S.managerMorale=70;S.page='dashboard';ensureContinentalSeason();log(`${manager} assumiu o comando do ${club}. Objetivo: construir uma temporada competitiva.`);autoSave();render();toast('Você é o novo treinador do '+club+'!')}function continueGame(){if(!savedCareer)return;S={...initial(),...savedCareer,page:'dashboard'};S.leagueTeams=S.leagueTeams||null;if(S.leagueTeams)Object.keys(S.leagueTeams).forEach(k=>{if(leagueTeams[k])leagueTeams[k]=S.leagueTeams[k]});addedLeagues.forEach(l=>{if(originalLeagueTeams[l])leagueTeams[l]=originalLeagueTeams[l].slice()});S.leagues=[...new Set([...(S.leagues||['Campeonato Brasileiro Série A','Campeonato Brasileiro Série B']),...addedLeagues])];S.leagueTables=S.leagueTables||{};S.matchHistory=S.matchHistory||[];S.seasonHistory=S.seasonHistory||[];S.seasonYear=S.seasonYear||2026;S.week=S.week||0;S.managerSquad=S.managerSquad||generateManagerSquad(S.managerClub||'Flamengo');S.managerLineup=S.managerLineup?.length?S.managerLineup:S.managerSquad.slice(0,11).map(p=>p.id);S.managerMarket=S.managerMarket||generateManagerMarket();S.managerBudget=S.managerBudget??20;ensureLeagueTables();ensureContinentalSeason();render()}function returnMainMenu(){autoSave();S.page='mainmenu';render()}
function deleteSave(){if(!confirm('Excluir definitivamente esta carreira neste navegador?'))return;localStorage.removeItem('careerManagerSave');savedCareer=null;S=initial();S.page='mainmenu';render();toast('Save excluído.')}
function about(){alert('Career Manager — simulador de gestão de clubes. Você comanda um clube, gerencia elenco, táticas, transferências, finanças e disputa competições. Todas as partidas das ligas acompanhadas são simuladas ao avançar a temporada.');}function go(p){S.page=p;render()}
function managerDashboard(){const squad=S.managerSquad||[],avg=squad.length?Math.round(squad.reduce((a,p)=>a+p.rating,0)/squad.length):0,table=getStandings(S.managerLeague||'Campeonato Brasileiro Série A'),pos=table.findIndex(x=>x.team===S.managerClub)+1,next=managerNextFixture();return head('Painel do clube','Visão geral',`${S.managerClub} • ${S.managerLeague} • Temporada ${S.seasonYear}`,`<div class="actions"><button class="primary" onclick="advanceWeek()">Avançar semana e simular rodada</button><button onclick="go('managerSquad')">Gerenciar elenco</button></div>`)+`<div class="grid stats">${stat('Posição na liga',pos?pos+'º':'—','Classificação atual')}${stat('Força média do elenco',avg+'/100','OVR médio')}${stat('Orçamento',fmt(S.managerBudget||0),'Disponível para transferências','green')}${stat('Moral do elenco',(S.managerMorale||70)+'/100','Ambiente do grupo')}</div><div class="grid cols">${card('Próximo compromisso',next?`${row('Rodada',next.week+'ª')}${row('Confronto',next.home+' × '+next.away)}${row('Mando',next.home===S.managerClub?'Casa':'Fora')}${row('Status',next.played?'Concluído':'Aguardando simulação')}`:'Nenhum confronto encontrado')}${card('Expectativas da diretoria',`${row('Competição principal',S.managerLeague)}${row('Meta da temporada',pos&&pos<=4?'Brigar por título e vaga continental':'Ficar na metade superior da tabela')}${row('Situação',S.managerMorale>=60?'Diretoria satisfeita':'Pressão por resultados')}${row('Treinador',S.managerName)}`)}</div><div class="grid cols" style="margin-top:14px">${card('Últimos resultados',managerRecentResults())}${card('Acesso rápido',`<div class="actions"><button onclick="go('managerTactics')">Escalação e táticas</button><button onclick="go('managerTransfers')">Mercado de transferências</button><button onclick="go('calendar')">Calendário completo</button><button onclick="go('finance')">Finanças do clube</button></div>`)}</div>`}function playerHistoryMarkup(p){const seasons=Object.entries(p.seasonStats||{}).sort((a,b)=>Number(b[0])-Number(a[0]));const clubs=(p.clubHistory||[{club:p.club,fromYear:S.seasonYear}]).slice().reverse();return `<details style="margin-top:12px;background:#111e31;border:1px solid var(--line);border-radius:9px;padding:10px"><summary style="cursor:pointer;font-weight:750">Histórico da carreira</summary><div style="margin-top:10px"><strong>Clubes por onde passou</strong>${clubs.map(c=>`<div class="item"><span>${c.club}</span><span class="muted small">${c.fromYear||'?'}${c.toYear?'–'+c.toYear:'– atual'}${c.type?' • '+c.type:''}</span></div>`).join('')||'<div class="muted small">Sem histórico de clubes.</div>'}</div><div class="divider"></div><strong>Estatísticas por temporada</strong>${seasons.map(([year,x])=>`<div class="card" style="padding:10px;margin-top:8px"><div class="row"><strong>Temporada ${year}</strong><strong class="green">${x.apps?((x.ratingSum/x.apps).toFixed(2)):'—'} média</strong></div><div class="muted small">${x.apps||0} partidas • ${x.goals||0} gols • ${x.assists||0} assistências</div></div>`).join('')||'<div class="muted small">As estatísticas serão registradas a partir das partidas simuladas.</div>'}</div></details>`}
function currentSeasonStats(p){const x=(p.seasonStats||{})[S.seasonYear]||{apps:0,goals:0,assists:0,ratingSum:0};return {apps:x.apps||0,goals:x.goals||0,assists:x.assists||0,average:x.apps?(x.ratingSum/x.apps).toFixed(2):'—'};}
function clientsPage(){return head('Portfólio','Meus jogadores','Gerencie contratos, valores, relações e oportunidades dos atletas que você representa.',`<div class="actions"><button class="primary" onclick="go('negotiations')">+ Negociar jovens</button></div>`)+`<div class="playergrid">${S.clients.map((p,i)=>`<div class="playercard"><div class="playerhead"><div><strong>${p.name}</strong><div class="muted small">${p.pos} • ${p.age} anos • ${p.country}</div></div><div class="rating">${p.rating}</div></div><div class="divider"></div>${row('Clube atual',p.club)}${row('Valor estimado',fmt(p.value))}${row('Salário',fmt(p.wage)+'/mês')}${row('Contrato',p.contract)}${row('Sua comissão',p.fee+'%')}${row('Relacionamento',p.relationship+'/100')}${(()=>{const st=currentSeasonStats(p);return row('Temporada '+S.seasonYear,`${st.apps} jogos • ${st.goals} gols • ${st.assists} assist. • média ${st.average}`)})()}${p.lastMatch?row('Última partida',p.lastMatch):''}${p.loan?row('Empréstimo',p.loan.to+' • temporário'):''}${playerHistoryMarkup(p)}<div class="bar"><i style="width:${p.relationship}%"></i></div><div class="actions" style="margin-top:12px"><button onclick="negotiateRenew(${i})">Renovar representação</button><button class="danger" onclick="releaseClient(${i})">Encerrar contrato</button></div></div>`).join('')||'<div class="empty">Você ainda não representa jogadores. Acesse Jovens disponíveis para negociar seu primeiro contrato de representação.</div>'}</div>`}
function negotiations(){return head('Recrutamento','Jovens disponíveis','A agência apresenta dois jovens fictícios por janela. Você decide quem contratar ou excluir.')+`<div class="notice" style="margin-bottom:14px">A lista começa com dois jovens aleatórios. Novos talentos só serão encontrados quando abrir uma janela de transferências (semana 20 ou 38).</div><div class="playergrid">${(S.youthPool||[]).map(p=>`<div class="playercard"><div class="playerhead"><div><strong>${p.name}</strong><div class="muted small">${p.age} anos • ${p.country}</div></div><div class="rating">${p.rating}</div></div><div class="divider"></div>${row('Posição',p.pos)}${row('Clube atual',p.club)}${row('Potencial',p.potential+'/100')}${row('Valor estimado',fmt(p.value))}${row('Situação',p.contract)}<div class="formgrid" style="margin-top:12px"><div><label>Comissão proposta (%)</label><input id="fee_${p.id}" type="number" min="5" max="15" value="8"></div><div><label>Duração (meses)</label><select id="term_${p.id}"><option value="12">12 meses</option><option value="24" selected>24 meses</option><option value="36">36 meses</option></select></div></div><button class="primary" style="width:100%;margin-top:10px" onclick="approachYouth('${p.id}')">Contratar jogador</button><button class="danger" style="width:100%;margin-top:8px" onclick="deleteYouth('${p.id}')">Excluir jogador achado</button></div>`).join('')||'<div class="empty">Nenhum jovem encontrado. A agência buscará dois novos jogadores na próxima abertura de janela.</div>'}</div>`}
function approachYouth(id){let p=(S.youthPool||[]).find(x=>x.id===id);if(!p)return;if(S.clients.some(x=>x.id===id))return toast('Você já representa este jogador.');let fee=Number(document.getElementById('fee_'+id)?.value||8),term=Number(document.getElementById('term_'+id)?.value||24);if(fee<5||fee>15)return toast('A comissão deve ficar entre 5% e 15%.');let chance=Math.max(.25,Math.min(.95,.48+(fee-8)*.055+(S.rep-10)*.003+(term>=24?.06:0)));if(Math.random()>chance){log(`${p.name} recusou a proposta de ${fee}% por ${term} meses.`);S.rep=Math.max(0,S.rep-1);autoSave();render();return toast(p.name+' recusou a proposta. Você pode tentar novamente com melhores condições.')}let client={...p,fee,term,relationship:58,status:'Contrato ativo',seasonStats:{[S.seasonYear]:{apps:0,goals:0,assists:0,ratingSum:0}},clubHistory:[{club:p.club,fromYear:S.seasonYear,type:'Atual'}]};S.clients.push(client);S.youthPool=S.youthPool.filter(x=>x.id!==id);S.rep=Math.min(100,S.rep+3);S.income+=.002;log(`${p.name} aceitou a proposta de representação: comissão de ${fee}% por ${term} meses.`);autoSave();render();toast(p.name+' assinou com sua agência!')}
function agency(){return head('Estrutura profissional','Minha agência','Organize sua operação, identidade e reputação como empresário.')+`<div class="grid cols">${card('Dados da agência',`<div class="stack"><label>Nome da agência</label><input id="agencyName" value="${S.agency}"><label>Nome do empresário</label><input id="agentName" value="${S.agent}"><button class="primary" onclick="saveAgency()">Salvar identidade</button></div>`)}${card('Indicadores',`${row('Atletas representados',S.clients.length)}${row('Reputação',S.rep+'/100')}${row('Valor do portfólio',fmt(S.clients.reduce((a,p)=>a+p.value,0)))}${row('Negociações concluídas',S.deals.filter(d=>d.status==='Aceita').length)}`)}</div>`}
function managerFinance(){const payroll=(S.managerSquad||[]).reduce((a,p)=>a+(p.wage||0),0);return head('Administração','Finanças do clube','Controle o orçamento, a folha salarial e os custos da temporada.')+`<div class="grid stats">${stat('Orçamento de transferências',fmt(S.managerBudget||0),'Caixa disponível')}${stat('Folha salarial',fmt(payroll),'Custo mensal')}${stat('Folha anual',fmt(payroll*12),'Projeção de salários')}${stat('Moral do elenco',(S.managerMorale||70)+'/100','Ambiente do clube')}</div><div class="grid cols">${card('Resumo financeiro',`${row('Clube',S.managerClub)}${row('Orçamento inicial',fmt(S.managerBudget||0))}${row('Folha salarial mensal',fmt(payroll))}${row('Saldo após salários',fmt((S.managerBudget||0)-payroll))}`)}${card('Investimento da diretoria',`<p class="muted small">A diretoria pode liberar recursos adicionais em função dos resultados e da posição na tabela. Nesta versão de teste, o orçamento é controlado pelas transferências.</p><div class="notice">Venda jogadores para recuperar orçamento. Evite comprometer a folha salarial.</div>`)}</div>`}function allGameClubs(){return Object.entries(leagueTeams).flatMap(([league,teams])=>teams.map(name=>({name,league,power:clubPowerRaw[name]?.v??52,source:clubPowerRaw[name]?.source||'estimativa do jogo',points:clubPowerRaw[name]?.points||null,meta:clubMeta[name]||['Informação não cadastrada','Estádio não cadastrado',null]}))).sort((a,b)=>b.power-a.power||a.name.localeCompare(b.name));}
function clubLeaguePosition(name){for(const l of Object.keys(leagueTeams)){const t=getStandings(l).slice().sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));const i=t.findIndex(x=>x.team===name);if(i>=0)return {league:l,position:i+1,total:t.length,points:t[i].pts,played:t[i].j};}return null;}
function goClub(name){S.selectedClub=name;S.page='clubDetail';render();}
function clubsPage(){const arr=allGameClubs();return head('Mundo do futebol','Clubes','Ranking de força, informações e acompanhamento dos clubes presentes na base do jogo.')+`<div class="notice" style="margin-bottom:14px">Índice de força calibrado com o Ranking Nacional de Clubes da CBF 2026 para equipes brasileiras e ratings públicos globais (StatsUltra) para clubes internacionais. Onde não há nota pública diretamente comparável, o jogo usa estimativa por liga, resultados e nível competitivo; esses valores aparecem identificados como estimativas.</div><div class="grid stats">${stat('Clubes cadastrados',arr.length,'Base de ligas do jogo')}${stat('Maior força',arr[0]?.name||'—',arr[0]?arr[0].power.toFixed(1)+'/100':'')}${stat('Ligas',Object.keys(leagueTeams).length,'Competições cadastradas')}${stat('Partidas registradas',(S.matchHistory||[]).length,'Na carreira atual')}</div>${card('Ranking de força dos clubes',`<div class="tablewrap"><table><thead><tr><th>#</th><th>Clube</th><th>Liga</th><th>Força</th><th>Posição na liga</th><th></th></tr></thead><tbody>${arr.map((c,i)=>{const pos=clubLeaguePosition(c.name);return `<tr><td>${i+1}</td><td>${clubBadge(c.name,c.league)}<strong>${c.name}</strong><div class="muted small">${c.meta[0]}</div></td><td>${c.league}</td><td><strong class="${c.power>=80?'green':c.power<60?'gold':''}">${c.power.toFixed(1)}</strong><div class="bar" style="width:90px"><i style="width:${c.power}%"></i></div></td><td>${pos?pos.position+'º / '+pos.total:'—'}</td><td><button onclick="goClub('${c.name.replace(/'/g,"\\'")}')">Ver clube</button></td></tr>`}).join('')}</tbody></table></div>`)}<p class="muted small">Referências consultadas em 05/11/2026. O ranking de força não muda com a tabela da carreira; a posição na liga muda conforme os jogos simulados.</p>`}
function clubDetailPage(){const name=S.selectedClub,c=allGameClubs().find(x=>x.name===name);if(!c)return head('Clubes','Clube não encontrado','Selecione um clube na lista.',`<button onclick="go('clubs')">Voltar</button>`);const players=[...playerPool.filter(p=>p.club===name),...S.clients.filter(p=>p.club===name)];const pos=clubLeaguePosition(name);const matches=(S.matchHistory||[]).filter(m=>m.home===name||m.away===name).sort((a,b)=>b.season-a.season||b.week-a.week).slice(0,38);const budget=Math.round(12000*Math.pow(c.power/55,2));const payroll=Math.round(budget*.42);const income=Math.round(budget*.18);const results=matches.map(m=>{const home=m.home===name,opp=home?m.away:m.home,forg=home?m.homeGoals:m.awayGoals,against=home?m.awayGoals:m.homeGoals;return `<tr><td>${m.season}</td><td>${m.week===38?'38ª':m.week+'ª'} rodada</td><td>${home?'Casa':'Fora'}</td><td>${opp}</td><td><strong>${forg}–${against}</strong></td><td class="${forg>against?'green':forg<against?'red':'gold'}">${forg>against?'V':forg<against?'D':'E'}</td></tr>`}).join('');return head('Ficha do clube',name,`${c.league} • ${c.meta[0]}`,`<button onclick="go('clubs')">← Voltar ao ranking</button>`)+`<div class="card clubhero">${crest(clubs.find(x=>x.name===name)||{name,abbr:name.split(' ').map(x=>x[0]).join('').slice(0,4),colors:['#31557a','#132238']})}<div><div class="eyebrow">Força ${c.power.toFixed(1)}/100 • ${c.source}</div><h1>${name}</h1><div class="muted">${c.meta[0]} • ${c.meta[1]} • ${c.meta[2]?'Fundado em '+c.meta[2]:'Fundação não cadastrada'}</div>${pos?`<span class="pill">${pos.position}º lugar • ${pos.points} pts na liga</span>`:'<span class="pill warn">Sem classificação ativa</span>'}</div></div><div class="grid stats" style="margin-top:14px">${stat('Força do clube',c.power.toFixed(1)+'/100','Índice de referência')}${stat('Posição na liga',pos?pos.position+'º':'—',pos?pos.league:'Sem tabela ativa')}${stat('Orçamento estimado','€ '+budget.toLocaleString('pt-BR'),'Estimativa demonstrativa')}${stat('Folha salarial estimada','€ '+payroll.toLocaleString('pt-BR')+'/mês','Não representa balanço oficial')}</div><div class="grid cols" style="margin-top:14px">${card('Informações do clube',`${row('País',c.meta[0].includes('Brasil')||c.league.includes('Brasileiro')?'Brasil':c.meta[0].split(',').slice(-1)[0])}${row('Competição',c.league)}${row('Estádio',c.meta[1])}${row('Fundação',c.meta[2]||'Não cadastrada')}${row('Índice de força',c.power.toFixed(1)+'/100')}${row('Fonte da força',c.source)}`)}${card('Finanças do clube',`${row('Orçamento anual estimado','€ '+budget.toLocaleString('pt-BR'))}${row('Folha salarial estimada','€ '+payroll.toLocaleString('pt-BR')+'/mês')}${row('Receita operacional estimada','€ '+income.toLocaleString('pt-BR'))}<p class="muted small">Valores fictícios para a simulação, calculados a partir do índice de força; não são dados financeiros publicados pelo clube.</p>`)}</div><div class="grid cols" style="margin-top:14px">${card('Elenco disponível na base',players.length?`<div class="tablewrap"><table><thead><tr><th>Jogador</th><th>Posição</th><th>Idade</th><th>OVR</th><th>Valor</th></tr></thead><tbody>${players.map(p=>`<tr><td>${p.name}${S.clients.includes(p)?' <span class="pill">Sua agência</span>':''}</td><td>${p.pos}</td><td>${p.age}</td><td><strong>${p.rating}</strong></td><td>${fmt(p.value)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum jogador deste clube está cadastrado na base local. A lista será preenchida conforme a base de jogadores for ampliada.</div>')}${card('Temporada e calendário',`${row('Partidas registradas',matches.length)}${row('Vitórias',matches.filter(m=>(m.home===name?m.homeGoals>m.awayGoals:m.awayGoals>m.homeGoals)).length)}${row('Empates',matches.filter(m=>m.homeGoals===m.awayGoals).length)}${row('Derrotas',matches.filter(m=>(m.home===name?m.homeGoals<m.awayGoals:m.awayGoals<m.homeGoals)).length)}<p class="muted small">As partidas são registradas à medida que você avança as semanas da carreira.</p>`)}</div>${card('Jogos da temporada',matches.length?`<div class="tablewrap"><table><thead><tr><th>Ano</th><th>Rodada</th><th>Local</th><th>Adversário</th><th>Placar</th><th>R</th></tr></thead><tbody>${results}</tbody></table></div>`:'<div class="empty">Ainda não há partidas simuladas. Avance a semana para gerar os jogos e preencher este histórico.</div>')}`}

function resetLeagueTeams(){Object.keys(originalLeagueTeams).forEach(k=>{leagueTeams[k]=originalLeagueTeams[k].slice()});}
function windowStatus(){
 if(S.week>=20&&S.week<=25)return {open:true,label:'1ª janela de transferências',detail:'Aberta • semanas 20 a 25'};
 if(S.week===38||(S.window2Active&&S.week>=0&&S.week<=6))return {open:true,label:'2ª janela de transferências',detail:S.week===38?'Aberta • semana 38 até a semana 6 do próximo ano':'Aberta • até a semana 6'};

function makeStandings(league){return (leagueTeams[league]||[]).map(team=>({team,j:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));}
function getStandings(league){const teams=leagueTeams[league]||[];if(!S.leagueTables[league])S.leagueTables[league]=makeStandings(league);else{const old=S.leagueTables[league],byName=new Map(old.map(t=>[t.team,t]));S.leagueTables[league]=teams.map(name=>byName.get(name)||({team:name,j:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));}return S.leagueTables[league];}

function simulateMlsPlayoffs(){
 if(S.week<38)return toast('Os playoffs da MLS só podem começar após a 38ª rodada.');
 const p=mlsPlayoffState(),east='MLS – Conferência Leste',west='MLS – Conferência Oeste';
 if(p.stage==='not_started'){
  const makeSide=league=>{const t=mlsSorted(league);if(t.length<9)throw new Error(`A conferência ${league} precisa ter pelo menos 9 clubes.`);return {seeds:t.slice(0,9).map((x,i)=>({seed:i+1,team:x.team})),wild:null,round1:[],semi:[],final:null,champion:null}};
  try{p.east=makeSide(east);p.west=makeSide(west);}catch(e){return toast(e.message)}
  p.stage='wild';autoSave();render();return toast('Playoffs iniciados! Agora clique em “Simular Wild Card” para disputar 8º x 9º.');
 }
 const playSide=side=>{
  if(p.stage==='wild'){side.wild=mlsSeries(side.seeds[7].team,side.seeds[8].team,false);return;}
  if(p.stage==='round1'){const qualified=[side.seeds[0].team,side.seeds[1].team,side.seeds[2].team,side.seeds[3].team,side.seeds[4].team,side.seeds[5].team,side.seeds[6].team,side.wild.winner];qualified.sort((a,b)=>side.seeds.find(x=>x.team===a).seed-side.seeds.find(x=>x.team===b).seed);side.round1=[[qualified[0],qualified[7]],[qualified[1],qualified[6]],[qualified[2],qualified[5]],[qualified[3],qualified[4]]].map(([a,b])=>mlsSeries(a,b,true));return;}
  if(p.stage==='semi'){const remain=side.round1.map(x=>x.winner).sort((a,b)=>side.seeds.find(x=>x.team===a).seed-side.seeds.find(x=>x.team===b).seed);side.semi=[[remain[0],remain[3]],[remain[1],remain[2]]].map(([a,b])=>mlsSeries(a,b,false));return;}
  if(p.stage==='conference_final'){const w=side.semi.map(x=>x.winner).sort((a,b)=>side.seeds.find(x=>x.team===a).seed-side.seeds.find(x=>x.team===b).seed);side.final=mlsSeries(w[0],w[1],false);side.champion=side.final.winner;}
 };
 if(p.stage==='wild'){playSide(p.east);playSide(p.west);p.stage='round1';log('Wild Card da MLS concluído nas duas conferências.');}
 else if(p.stage==='round1'){playSide(p.east);playSide(p.west);p.stage='semi';log('Primeira rodada dos playoffs MLS concluída.');}
 else if(p.stage==='semi'){playSide(p.east);playSide(p.west);p.stage='conference_final';log('Semifinais das conferências MLS concluídas.');}
 else if(p.stage==='conference_final'){playSide(p.east);playSide(p.west);p.stage='cup_final';log(`Finais de conferência: ${p.east.champion} e ${p.west.champion} disputarão a MLS Cup.`);}
 else if(p.stage==='cup_final'){p.cup=mlsSeries(p.east.champion,p.west.champion,false);p.champion=p.cup.winner;p.runnerUp=p.cup.winner===p.east.champion?p.west.champion:p.east.champion;p.stage='completed';log(`${p.champion} conquistou a MLS Cup ${S.seasonYear}!`);}
 else return toast('Os playoffs desta temporada já foram concluídos.');
 autoSave();render();toast(p.stage==='completed'?`MLS Cup: ${p.champion} campeão!`:'Fase dos playoffs simulada.');
}

function championsPage(){const records=(S.seasonHistory||[]).slice().sort((a,b)=>b.year-a.year);const leaguesShown=[...new Set([...(S.leagues||[]),...records.flatMap(r=>Object.keys(r.champions||r.leagues||{}))])];const championOf=(record,league)=>{const saved=record.champions?.[league];if(saved?.champion)return saved;const table=record.leagues?.[league]||[];return table.length?{champion:table[0].team,runnerUp:table[1]?.team||'—',points:table[0].pts}:null};return head('Memória das competições','Histórico de campeões','Todos os campeões e vice-campeões das ligas nacionais e competições continentais, temporada por temporada.')+`<div class="grid stats">${stat('Temporadas arquivadas',records.length,'Histórico salvo na carreira')}${stat('Competições acompanhadas',leaguesShown.length,'Ligas selecionadas')}${stat('Última temporada concluída',records[0]?.year||'—','Temporada mais recente')}${stat('Campeões registrados',records.reduce((n,r)=>n+Object.keys(r.champions||r.leagues||{}).filter(l=>championOf(r,l)).length,0),'Títulos arquivados')}</div>${records.length?records.map(record=>`<section class="card" style="margin-bottom:14px"><div class="row" style="margin-bottom:12px"><h2 style="margin:0">Temporada ${record.year}</h2><span class="pill">Concluída</span></div><div class="grid three">${leaguesShown.map(league=>{const c=championOf(record,league);return c?`<div style="background:#0c1728;border:1px solid var(--line);border-radius:11px;padding:12px"><div class="eyebrow" style="margin-bottom:8px">${league.replace('Campeonato Brasileiro','Brasileirão')}</div><div style="display:flex;align-items:center;gap:9px">${clubBadge(c.champion,league)}<div><strong>${c.champion}</strong><div class="small green">CAMPEÃO</div></div></div><div class="muted small" style="margin-top:9px">Vice: ${c.runnerUp||'—'}${c.points!==undefined?' • '+c.points+' pts':''}</div></div>`:''}).join('')}</div></section>`).join(''):'<div class="card empty">Nenhum campeão registrado ainda. Ao concluir a primeira temporada (38ª rodada), os campeões e vice-campeões serão salvos automaticamente aqui.</div>'}<div class="notice">O histórico é atualizado automaticamente no encerramento de cada temporada e permanece salvo junto com sua carreira.</div>`}
function applyPromotionRelegation(){const a='Campeonato Brasileiro Série A',b='Campeonato Brasileiro Série B',h=S.seasonHistory?.find(x=>x.year===S.seasonYear);if(!h?.promoted||!h?.relegated||!leagueTeams[a]||!leagueTeams[b])return;leagueTeams[a]=leagueTeams[a].filter(t=>!h.relegated.includes(t)).concat(h.promoted);leagueTeams[b]=leagueTeams[b].filter(t=>!h.promoted.includes(t)).concat(h.relegated);S.leagueTeams={...S.leagueTeams,[a]:leagueTeams[a].slice(),[b]:leagueTeams[b].slice()};S.leagueTables={};ensureLeagueTables();if(h?.promotedC?.length===4&&leagueTeams[b]&&leagueTeams['Campeonato Brasileiro Série C']){const bottom=(h.leagues?.[b]||[]).slice(-4).map(x=>x.team);leagueTeams[b]=leagueTeams[b].filter(t=>!bottom.includes(t)).concat(h.promotedC);leagueTeams['Campeonato Brasileiro Série C']=leagueTeams['Campeonato Brasileiro Série C'].filter(t=>!h.promotedC.includes(t)).concat(bottom);S.leagueTeams={...(S.leagueTeams||{}),[b]:leagueTeams[b].slice(),'Campeonato Brasileiro Série C':leagueTeams['Campeonato Brasileiro Série C'].slice()};}const pairs=[['Premier League','Sky Bet Championship'],['La Liga','La Liga 2'],['Serie A Italiana','Serie B Italiana'],['Bundesliga','Bundesliga 2'],['Ligue 1','Ligue 2']];pairs.forEach(([top,second])=>{const mt=h?.divisionMoves?.[top],ms=h?.divisionMoves?.[second];if(!mt||!ms||!leagueTeams[top]||!leagueTeams[second])return;const relegated=mt.down||[],promoted=ms.up||[];if(relegated.length&&promoted.length){leagueTeams[top]=leagueTeams[top].filter(t=>!relegated.includes(t)).concat(promoted);leagueTeams[second]=leagueTeams[second].filter(t=>!promoted.includes(t)).concat(relegated);}const relegatedSecond=ms.down||[],promotedTop=mt.up||[];if(relegatedSecond.length&&promotedTop.length){leagueTeams[second]=leagueTeams[second].filter(t=>!relegatedSecond.includes(t)).concat(promotedTop);leagueTeams[top]=leagueTeams[top].filter(t=>!promotedTop.includes(t)).concat(relegatedSecond);}S.leagueTeams={...(S.leagueTeams||{}),[top]:leagueTeams[top].slice(),[second]:leagueTeams[second].slice()};});S.leagueTables={};ensureLeagueTables();log(`Acesso e rebaixamento aplicados para ${S.seasonYear}.`);}
function advanceWeek(){
 const old=S.week;
 if(old===38){
  if(S.seasonFinalizedYear!==S.seasonYear)finalizeSeason();
  applyPromotionRelegation();
  S.week=0;S.seasonYear++;S.year=S.seasonYear;S.leagueTables={};S.seriesCGroups=null;S.mlsPlayoffs=null;ensureLeagueTables();S.continental=null;S.window2Active=true;
  rewardReputation(`year-${S.seasonYear}`,`Início do ano ${S.seasonYear}`);
  log(`Ano ${S.seasonYear} iniciado. A segunda janela continua aberta até a semana 6.`);
 }else{
  S.week=old+1;
  if(S.week===20){refreshYouthAtWindow();rewardReputation(`${S.seasonYear}-window1`,'Abertura da primeira janela');log('Primeira janela aberta (semanas 20–25).');}
  if(S.week===26)log('Primeira janela encerrada. Mercado fechado.');
  if(S.week===38){refreshYouthAtWindow();S.window2Active=true;rewardReputation(`${S.seasonYear}-window2`,'Abertura da segunda janela');log(`Temporada ${S.seasonYear} encerrada. Campeonato concluído e segunda janela aberta até a semana 6 do próximo ano.`);}
  if(S.week===7&&S.window2Active){S.window2Active=false;log('Segunda janela encerrada após a semana 6.');}
 }
 S.clients.forEach(p=>{if(p.loan&&((p.loan.season===S.seasonYear&&S.week>=p.loan.untilWeek)||S.seasonYear>p.loan.season)){const parent=p.loan.from;p.clubHistory=p.clubHistory||[];if(p.clubHistory.length)p.clubHistory[p.clubHistory.length-1].toYear=S.seasonYear;p.clubHistory.push({club:parent,fromYear:S.seasonYear,type:'Retorno de empréstimo'});p.club=parent;delete p.loan;log(`${p.name} retornou do empréstimo ao ${parent}.`);}});
 const results=playWeeklyFixtures();
 simulateContinentalWeek();
 if(S.week===38&&S.seasonFinalizedYear!==S.seasonYear)finalizeSeason();
 if(S.managerClub){const played=(S.matchHistory||[]).filter(m=>m.season===S.seasonYear&&m.week===S.week&&m.league===S.managerLeague&&(m.home===S.managerClub||m.away===S.managerClub));if(played.length){const m=played[0],gf=m.home===S.managerClub?m.homeGoals:m.awayGoals,ga=m.home===S.managerClub?m.awayGoals:m.homeGoals;S.managerMorale=Math.max(10,Math.min(100,(S.managerMorale||70)+(gf>ga?5:gf===ga?1:-6)));if(gf>ga)S.managerBudget=(S.managerBudget||0)+.12;log(`${S.managerClub}: ${gf>ga?'vitória':gf===ga?'empate':'derrota'} na rodada ${S.week}. Moral do elenco: ${S.managerMorale}/100.`);}}
 log(S.week===0?`Semana 0: início da pré-temporada ${S.seasonYear}.`:`Semana ${S.week}: ${S.week<=38?'rodada simulada':'período de mercado'}${results.length?' — '+results.slice(0,3).join(' | ')+(results.length>3?' e outros jogos':''):''}.`);
 autoSave();render();toast(S.week===0?`Ano ${S.seasonYear}: pré-temporada iniciada.`:`Semana ${S.week}: ${S.week<=38?'partidas simuladas':'mercado atualizado'}.`);
}
function managerNews(){return head('Central de informação','Notícias do futebol','Acompanhe os acontecimentos do seu clube e das competições.')+card('Últimos acontecimentos',(S.news||[]).map(x=>`<div class="logline">▸ ${x}</div>`).join('')||'Nenhuma notícia ainda.')+card('Diário da carreira',(S.log||[]).map(x=>`<div class="logline">▸ ${x}</div>`).join(''))}function signPlayer(i){let p=S.scouted[i];if(!p)return;if(S.clients.some(x=>x.name===p.name))return toast('Este jogador já está representado.');let n={...p,fee:8,relationship:55,status:'Contrato ativo',seasonStats:{[S.seasonYear]:{apps:0,goals:0,assists:0,ratingSum:0}},clubHistory:[{club:p.club,fromYear:S.seasonYear,type:'Atual'}]};S.clients.push(n);S.scouted.splice(i,1);S.rep=Math.min(100,S.rep+2);log(`Contrato de representação assinado com ${p.name}.`);S.income+=.01;autoSave();render();toast(p.name+' agora faz parte do seu portfólio.')}
function deleteYouth(id){const p=(S.youthPool||[]).find(x=>x.id===id);if(!p)return;if(!confirm('Excluir '+p.name+' da lista de jovens encontrados?'))return;S.youthPool=S.youthPool.filter(x=>x.id!==id);log(`${p.name} foi removido da lista de jovens encontrados.`);autoSave();render();toast('Jogador excluído da lista.')}
function releaseClient(i){let p=S.clients[i];if(!p)return;if(!confirm('Encerrar o contrato de representação de '+p.name+'?'))return;S.clients.splice(i,1);log(`Contrato de representação encerrado com ${p.name}.`);autoSave();render()}
function negotiateRenew(i){let p=S.clients[i];if(!p)return;p.fee=Math.min(15,p.fee+1);p.relationship=Math.min(100,p.relationship+8);p.status='Representação renovada';log(`Representação de ${p.name} renovada. Comissão ajustada para ${p.fee}%.`);autoSave();render();toast('Contrato de representação renovado.')}
function createDeal(){let p=S.clients[Number(document.getElementById('dealPlayer').value)];if(!p)return toast('Adicione jogadores ao portfólio primeiro.');let club=document.getElementById('dealClub').value,value=Number(document.getElementById('dealValue').value),fee=Number(document.getElementById('dealFee').value);if(value<=0||fee<1||fee>20)return toast('Confira os valores da proposta.');S.deals.unshift({id:Date.now(),player:p.name,club,value,fee,status:'Em análise'});log(`Proposta enviada por ${p.name}: ${club} ofereceu ${fmt(value)}.`);autoSave();render()}
function dealDecision(id,yes){let d=S.deals.find(x=>x.id===id);if(!d)return;d.status=yes?'Aceita':'Recusada';if(yes){let commission=d.value*d.fee/100;S.cash+=commission;S.income+=commission/12;S.rep=Math.min(100,S.rep+3);log(`Acordo aceito: ${d.player} negociado com ${d.club}. Comissão da agência: ${fmt(commission)}.`)}else log(`Proposta por ${d.player} recusada pela agência.`);autoSave();render()}
function saveAgency(){S.agency=document.getElementById('agencyName').value.trim()||'Minha Agência';S.agent=document.getElementById('agentName').value.trim()||'Empresário';log('Identidade da agência atualizada.');autoSave();render();toast('Dados da agência salvos.')}
function investAgency(){let n=Number(document.getElementById('investValue').value)/100000;if(n<=0||n>S.cash)return toast('Saldo insuficiente ou valor inválido.');S.cash-=n;S.rep=Math.min(100,S.rep+2);log(`Agência investiu ${fmt(n)} em observação de mercado e relacionamento.`);autoSave();render()}
function advanceMonth(){let net=S.income-S.expenses;S.cash+=net;S.month++;if(S.month>11){S.month=0;S.year++}S.clients.forEach(p=>{p.relationship=Math.max(35,Math.min(100,p.relationship+(Math.random()>.35?2:-1))) });log(`Relatório mensal: ${net>=0?'resultado positivo':'resultado negativo'} de ${fmt(net)}.`);autoSave();render()}
render();
</script></body></html>
